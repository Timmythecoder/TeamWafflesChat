<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waffle Slots</title>
<style>
    @import url("https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700&display=swap");
    body { background: #202225; color: white; font-family: "Be Vietnam Pro", sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .slot-machine { background: #2f3136; padding: 30px; border-radius: 20px; border: 5px solid #faa61a; text-align: center; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
    .reels { display: flex; gap: 10px; margin-bottom: 20px; background: #000; padding: 10px; border-radius: 10px; }
    .reel { width: 80px; height: 100px; background: white; color: black; font-size: 50px; display: flex; align-items: center; justify-content: center; border-radius: 5px; }
    button { padding: 15px 30px; font-size: 20px; background: #faa61a; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; transition: transform 0.1s; }
    button:active { transform: scale(0.95); }
    button:disabled { background: #555; cursor: not-allowed; }
    #status { margin-top: 20px; font-size: 20px; height: 30px; color: #e6a15c; }
    #credits { font-size: 24px; margin-bottom: 10px; color: #ffd700; }
</style>
</head>
<body>

<div class="slot-machine">
    <div id="credits">Credits: 100</div>
    <div class="reels">
        <div class="reel" id="reel1">🧇</div>
        <div class="reel" id="reel2">🧇</div>
        <div class="reel" id="reel3">🧇</div>
    </div>
    <button id="spinBtn" onclick="spin()">SPIN (10)</button>
    <div id="status"></div>
</div>

<script>
    const symbols = ['🧇', '🍒', '🍋', '🍇', '💎', '7️⃣'];
    let credits = 100;
    const cost = 10;
    const reelEls = [document.getElementById('reel1'), document.getElementById('reel2'), document.getElementById('reel3')];
    const statusEl = document.getElementById('status');
    const creditsEl = document.getElementById('credits');
    const spinBtn = document.getElementById('spinBtn');

    function spin() {
        if (credits < cost) {
            statusEl.innerText = "Not enough credits!";
            return;
        }

        credits -= cost;
        updateDisplay();
        spinBtn.disabled = true;
        statusEl.innerText = "Spinning...";

        let results = [];
        let completed = 0;

        reelEls.forEach((reel, i) => {
            let speed = 100 + i * 50;
            let interval = setInterval(() => {
                reel.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            }, 100);

            setTimeout(() => {
                clearInterval(interval);
                let finalSymbol = symbols[Math.floor(Math.random() * symbols.length)];
                reel.innerText = finalSymbol;
                results[i] = finalSymbol;
                completed++;
                if (completed === 3) checkWin(results);
            }, 1000 + i * 500);
        });
    }

    function checkWin(results) {
        spinBtn.disabled = false;
        if (results[0] === results[1] && results[1] === results[2]) {
            let prize = results[0] === '💎' ? 500 : (results[0] === '7️⃣' ? 200 : 50);
            credits += prize;
            statusEl.innerText = `JACKPOT! You won ${prize} credits!`;
        } else {
            statusEl.innerText = "Try again!";
        }
        updateDisplay();
    }

    function updateDisplay() { creditsEl.innerText = "Credits: " + credits; }
</script>
</body>
</html>
