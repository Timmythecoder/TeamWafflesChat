<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Basketball Legends</title>
<style>
    body, html {
        margin: 0;
        padding: 0;
        background-color: #000;
        height: 100%;
        overflow: hidden;
    }
    iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>
    <iframe id="game-frame" title="Basketball Legends" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"></iframe>
    <script>
        fetch('https://cdn.jsdelivr.net/gh/testamalame/sef@main/lgdns.xml')
            .then(response => response.text())
            .then(data => {
                const iframe = document.getElementById('game-frame');
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                doc.open();
                doc.write(data);
                doc.close();
            })
            .catch(error => {
                console.error('Error loading game:', error);
            });
    </script>
</body>
</html>
