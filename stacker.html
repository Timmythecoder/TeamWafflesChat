<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Stacker</title>

        <link rel="shortcut icon" href="icon16.png" type="image/x-icon" />
        <style>
            :root{font-size:18px;font-family:Arial,Helvetica,sans-serif}
            html,body{background-color:#222;margin:0;padding:0;color:#fff;width:100%;height:100%;overflow:hidden;display:flex;justify-content:center;align-items:center;}
            
            /* Mobile Controls */
            #mobile-controls {
                position: absolute;
                bottom: 20px;
                left: 0;
                width: 100%;
                height: 120px;
                display: none; /* Hidden by default, shown via JS if touch detected */
                pointer-events: none;
                justify-content: space-between;
                padding: 0 30px;
                z-index: 1000;
            }
            .d-pad, .action-pad {
                pointer-events: auto;
                display: flex;
                gap: 15px;
                align-items: flex-end;
            }
            .control-btn {
                width: 60px;
                height: 60px;
                background: rgba(255, 255, 255, 0.15);
                border: 2px solid rgba(255, 255, 255, 0.3);
                border-radius: 50%;
                color: white;
                font-size: 24px;
                display: flex;
                justify-content: center;
                align-items: center;
                user-select: none;
                touch-action: manipulation;
            }
            .control-btn:active { background: rgba(255, 255, 255, 0.4); }

            /* Responsive Game Container */
            main {
                position: relative;
                /* Maintain 450/810 aspect ratio */
                aspect-ratio: 450/810;
                height: 100%;
                width: auto;
                max-width: 100%;
                max-height: 100%;
                margin: auto;
            }
            
            canvas { width: 100%; height: 100%; display: block; }
            
            *{box-sizing:border-box;user-select:none}*[hidden]{display:none !important}
            main>button{position:absolute;top:5%;margin:0;padding:0;border:none;cursor:pointer;background-color:rgba(0,0,0,0);border-radius:4px;padding:6px;outline:none;transition:all .04s ease;transform:translate(-50%, -50%);width:10%;height:auto;aspect-ratio:1/1;display:flex;justify-content:center;align-items:center}
            main>button img{position:relative;width:100%;height:100%;filter:invert(1)}
            main>button#restart{left:10%}
            main>button#pause{right:10%;transform:translate(50%, -50%)}
            main>button:hover{background-color:rgba(170,170,170,.35)}main>button:active{padding:5px}
            main div.controls{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ccc;position:absolute;top:15%;left:0;font-size:clamp(12px, 2vh, 18px);width:100%;height:85%;pointer-events:none;padding:10px}
            main div.controls[hidden]{display:flex !important;opacity:0}main div.controls.animated{transition:opacity .2s ease}main div.controls h1{margin-top:0}main div.controls p{margin:.5em 0;text-align:center;color:#fff}main div.controls div.row{display:flex;flex-direction:row;justify-content:center}main div.controls div.row div.spacer{width:10px}kbd{display:block;width:fit-content;height:fit-content;min-width:1.8em;text-align:center;background-color:#eee;border-radius:3px;border:5px solid #aaa;border-right-color:#ccc;border-bottom-color:#ccc;color:#333;font-weight:700;line-height:1;padding:2px 4px;white-space:nowrap}kbd.space{padding:0 2em}
            footer{position:absolute;bottom:10px;width:100%;display:flex;flex-direction:row;align-items:center;justify-content:center;pointer-events:auto;}footer a{font-size:13px;color:gray;text-decoration:none;margin:0 6px}
        </style>

        <script>
            // Mock chrome.storage for high score persistence
            if (typeof chrome === 'undefined') window.chrome = {};
            if (!chrome.storage) chrome.storage = {};
            if (!chrome.storage.local) {
                chrome.storage.local = {
                    get: function(keys, cb) {
                        let items = {};
                        let keyList = Array.isArray(keys) ? keys : [keys];
                        keyList.forEach(k => {
                            let val = localStorage.getItem(k);
                            if(val !== null) {
                                try { items[k] = JSON.parse(val); } catch(e) { items[k] = val; }
                            }
                        });
                        if(cb) cb(items);
                    },
                    set: function(items, cb) {
                        for(let k in items) {
                            localStorage.setItem(k, JSON.stringify(items[k]));
                        }
                        if(cb) cb();
                    }
                };
            }
            if (!chrome.storage.sync) chrome.storage.sync = chrome.storage.local;
            if (!chrome.runtime) chrome.runtime = {};
            if (!chrome.runtime.getManifest) chrome.runtime.getManifest = () => ({version: '1.0'});
            if (!chrome.runtime.connect) chrome.runtime.connect = () => ({});

    </head>
    <body>
        <main>
            <canvas id="canvas" width="450" height="810"></canvas>

            <button id="restart">
            
                <img src="restart.png" alt="Restart" />
            </button>
            <button id="pause">

                <img src="pause.png" alt="pause" />
            </button>

            <div class="controls" hidden>
                <div class="row">
                    <kbd>&uparrow;</kbd>
                    <div class="spacer"></div>
                    <kbd>W</kbd>
                </div>

                <p>&circlearrowright; Rotate</p>

                <div class="row">
                    <kbd>&leftarrow;</kbd>
                    <kbd>&rightarrow;</kbd>
                    <div class="spacer"></div>
                    <kbd>A</kbd>
                    <kbd>D</kbd>
                </div>

                <p>&leftarrow; Left/Right &rightarrow;</p>

                <div class="row">
                    <kbd>&downarrow;</kbd>
                    <div class="spacer"></div>
                    <kbd>S</kbd>
                </div>

                <p>&downarrow; Drop down &downarrow;</p>

                <kbd class="space">Space</kbd>

                <p>&dArr; Hard drop &dArr;</p>

                <kbd>Esc</kbd>

                <p>Close popup &times;</p>
            </div>

            <!-- Mobile Controls Overlay -->
            <div id="mobile-controls">
                <div class="d-pad">
                    <button class="control-btn" id="btn-left">←</button>
                    <button class="control-btn" id="btn-down">↓</button>
                    <button class="control-btn" id="btn-right">→</button>
                </div>
                <div class="action-pad">
                    <button class="control-btn" id="btn-rotate">↻</button>
                    <button class="control-btn" id="btn-drop">⤓</button>
                </div>
            </div>
            <script>
                // Detect touch to show controls
                window.addEventListener('touchstart', function onFirstTouch() {
                    document.getElementById('mobile-controls').style.display = 'flex';
                    window.removeEventListener('touchstart', onFirstTouch, false);
                }, false);

                function simulateKey(key, type) {
                    const event = new KeyboardEvent(type, {
                        key: key,
                        code: key === ' ' ? 'Space' : (key === 'ArrowUp' ? 'ArrowUp' : key === 'ArrowDown' ? 'ArrowDown' : key === 'ArrowLeft' ? 'ArrowLeft' : key === 'ArrowRight' ? 'ArrowRight' : 'Key' + key.toUpperCase()),
                        bubbles: true
                    });
                    document.dispatchEvent(event);
                }

                function bindBtn(id, key) {
                    const btn = document.getElementById(id);
                    btn.addEventListener('touchstart', (e) => { e.preventDefault(); simulateKey(key, 'keydown'); });
                    btn.addEventListener('touchend', (e) => { e.preventDefault(); simulateKey(key, 'keyup'); });
                }

                bindBtn('btn-left', 'ArrowLeft');
                bindBtn('btn-right', 'ArrowRight');
                bindBtn('btn-down', 'ArrowDown');
                bindBtn('btn-rotate', 'ArrowUp'); // Rotate
                bindBtn('btn-drop', ' '); // Hard drop
            </script>
        </main>

        <div id="ads"></div>
