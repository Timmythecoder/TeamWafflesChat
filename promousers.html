<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Promo Code Usage Viewer</title>
  <style>
    :root {
        --bg-dark: #2f3136;
        --bg-medium: #36393f;
        --bg-light: #40444b;
        --border-color: #202225;
        --text-primary: #dcddde;
        --text-secondary: #b9bbbe;
        --accent: #5865F2;
        --danger: #f04747;
    }
    body { 
        font-family: 'Segoe UI', 'Roboto', sans-serif; 
        background: var(--bg-dark); 
        color: var(--text-primary);
        padding: 20px; 
        margin: 0;
    }
    h1, h2 { 
        color: #fff; 
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 10px;
        margin-top: 0;
    }
    .section {
      background: var(--bg-medium); 
      padding: 20px; 
      margin-bottom: 20px; 
      border-radius: 8px; 
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .user, .badge-item {
      background: var(--bg-light); 
      padding: 15px; 
      margin-bottom: 10px;
      border: 1px solid var(--border-color); 
      border-radius: 6px;
    }
    .user-info, .badge-name {
      font-weight: bold; 
      margin-bottom: 6px; 
      color: #fff;
    }
    input[type="text"], input[type="password"] { margin-top: 5px; padding: 10px; font-size: 14px; width: 100%; box-sizing: border-box; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-dark); color: var(--text-primary); }
    input:focus { outline: none; border-color: var(--accent); }
    button {
      margin-top: 10px; cursor: pointer; padding: 10px 15px;
      border-radius: 5px; border: none; background-color: var(--accent);
      color: white; font-weight: bold; transition: filter 0.2s;
    }
    button:hover { filter: brightness(1.1); }
    a { color: var(--accent); text-decoration: none; margin-top: 10px; display: inline-block; }
  </style>
</head>
<body>
  <div id="pinOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#333;z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;color:white;">
    <h2>Admin Access</h2>
    <p>Please enter the admin PIN to continue.</p>
    <input type="password" id="adminPinInput" placeholder="Enter PIN" style="padding:10px;font-size:16px;border-radius:5px;border:none;margin-bottom:10px;color:black;width:200px;">
    <button id="verifyPinBtn" style="padding:10px 20px;font-size:16px;cursor:pointer;">Enter</button>
  </div>

  <h1>Promo Code Usage</h1>

  <div class="section">
    <h2>Search Redemptions</h2>
    <input type="text" id="promoCodeInput" placeholder="Enter Promo Code (case-insensitive)">
    <button id="searchBtn">Search</button>
  </div>

  <div class="section">
    <h2>Results for "<span id="searchedCode"></span>"</h2>
    <div id="resultsContainer">Enter a code and click search.</div>
  </div>
  
  <a href="admin.html">← Back to Admin Panel</a>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCfTDFXdh1tifQIyY6415IORbdXIffYUJ4",
      authDomain: "team-waffles.firebaseapp.com",
      databaseURL: "https://team-waffles-default-rtdb.firebaseio.com",
      projectId: "team-waffles",
      storageBucket: "team-waffles.appspot.com",
      messagingSenderId: "891460090478",
      appId: "1:891460090478:web:c01b6db1af21745769047f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    document.getElementById("verifyPinBtn").onclick = async () => {
      const input = document.getElementById("adminPinInput").value.trim();
      const snap = await get(ref(db, "config/adminPin"));
      const realPin = snap.exists() ? String(snap.val()) : "1234";
      
      if (input === realPin) {
        document.getElementById("pinOverlay").style.display = "none";
      } else {
        alert("Incorrect PIN!");
      }
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("pinOverlay").style.display = "flex";
      } else {
        alert("No user detected. Please log in.");
        window.location.href = "index.html";
      }
    });

    document.getElementById('searchBtn').onclick = async () => {
        const code = document.getElementById('promoCodeInput').value.trim().toUpperCase();
        if (!code) return alert("Please enter a promo code.");

        const resultsContainer = document.getElementById('resultsContainer');
        document.getElementById('searchedCode').innerText = code;
        resultsContainer.innerHTML = "Loading...";

        try {
            const usersSnap = await get(ref(db, 'users'));
            if (!usersSnap.exists()) {
                resultsContainer.innerHTML = "<p>No users found in the database.</p>";
                return;
            }

            const users = usersSnap.val();
            const redeemers = [];

            for (const uid in users) {
                const user = users[uid];
                if (user.redeemed_codes && user.redeemed_codes[code]) {
                    const redemptionData = user.redeemed_codes[code];
                    redeemers.push({
                        displayName: user.displayName || user.permanentUsername || 'Unknown',
                        uid: uid,
                        timestamp: redemptionData.timestamp
                    });
                }
            }

            if (redeemers.length === 0) {
                resultsContainer.innerHTML = "<p>No users have redeemed this code.</p>";
                return;
            }

            redeemers.sort((a, b) => b.timestamp - a.timestamp);

            resultsContainer.innerHTML = "";
            redeemers.forEach(redeemer => {
                const div = document.createElement('div');
                div.className = 'badge-item'; // Re-using style from admin panel
                const redemptionDate = new Date(redeemer.timestamp).toLocaleString();
                div.innerHTML = `
                    <div class="badge-name">${redeemer.displayName}</div>
                    <p>UID: ${redeemer.uid}</p>
                    <p>Redeemed on: ${redemptionDate}</p>
                `;
                resultsContainer.appendChild(div);
            });

        } catch (error) {
            console.error("Error fetching redemptions:", error);
            resultsContainer.innerHTML = `<p style="color:red;">Error: ${error.message}</p>`;
        }
    };
  </script>
</body>
</html>
