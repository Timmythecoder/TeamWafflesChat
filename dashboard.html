:root {
  --bg-main: linear-gradient(135deg, #f6b98d, #ffa07a);

  --text-light: #ffffff;
  --text-muted: #bbbbbb;

* {

  padding: 0;
}

body {

.btn-updates {

.room-list,

function addRoom() {
  const name = document.getElementById("room_name").value.trim();
  const password = document.getElementById("room_password").value.trim();
  const type = document.getElementById("room_type").value;

  if (!name) {
    alert("Please enter a room name.");
    return;
  }

  const roomData = {
    type: type,
    password: type === "private" ? password : "", // Only save password if private
    createdAt: new Date().toISOString()
  };

  firebase.database().ref("rooms/" + name).set(roomData, (error) => {
    if (error) {
      alert("Failed to create room: " + error.message);
    } else {
      alert("Room #" + name + " added successfully!");
      document.getElementById("room_name").value = "";
      document.getElementById("room_password").value = "";
      document.getElementById("room_type").value = "public";
      toggleAddRooms(); // Hide the add room form

      // Auto close rooms list and reset button text
      const list = document.getElementById("room_list");
      const btn = document.querySelector('button[onclick="toggleRooms()"]');
      if (!list.classList.contains("hidden")) {
        list.classList.add("hidden");
      }
      if (btn) btn.innerText = "Open Rooms";
    }
  });
}




function loadRooms(callback) {
  roomsRef.once("value", function(snapshot) {
    let output = "<h3>Available Rooms</h3>";
    snapshot.forEach(function(childSnapshot) {
      let roomName = childSnapshot.key;
      let roomData = childSnapshot.val();

      // Filter out private DMs so they don't appear in the public list
      if (roomData.type === 'dm') return;

      let roomIcon = roomData.type === 'private'
  ? "<span class='locked-icon' style='font-size: 2rem;'>🔒</span>"
  : "<span class='public-icon' style='font-size: 2rem;'>🌍</span>";

      let passwordInput = roomData.type === 'private'
        ? `<input type="password" placeholder="Enter Password" autocomplete="new-password" class="form-control" id="password_${roomName}" />`
        : '';

      // Parse online users
      let usersHtml = "";
      if (roomData.onlineUsers) {
        const names = Object.values(roomData.onlineUsers).map(u => u.name);
        if (names.length > 0) {
          usersHtml = `<div class="room-users-preview">👤 ${names.join(", ")}</div>`;
        }
      }

      output += `<div class='room-item'>
                  <div>
                    <button class='btn btn-primary' onclick='joinRoom("${roomName}")'>#${roomName}</button>
                    ${usersHtml}
                  </div>
                  <div style="display:flex; align-items:center;">
                  ${roomIcon}
                  ${passwordInput}
                  </div>
                </div>`;
    });

    document.getElementById("room_list").innerHTML = output;
    if (typeof callback === "function") callback();
  });
}


function toggleRooms() {
  const list = document.getElementById("room_list");
  const inbox = document.getElementById("inbox_list");
  const search = document.getElementById("search_section");
  const updateLog = document.getElementById("update_log_section");
  const btn = document.querySelector('button[onclick="toggleRooms()"]');

  if (list.classList.contains("hidden")) {
    list.classList.remove("hidden");
    inbox.classList.add("hidden");
    search.classList.add("hidden");
    updateLog.classList.add("hidden");
    if (btn) btn.innerText = "Close Rooms";
    showLoadingVideo();
    loadRooms(() => {
      removeLoadingVideo();
    });
  } else {
    list.classList.add("hidden");
    if (btn) btn.innerText = "Open Rooms";
  }
}

/* ───── Point System & Shop Logic ───── */
let shopItemsData = {
  "default": { name: "Default", cost: 0, class: "bubble-default" },
  "blue": { name: "Ocean", cost: 100, class: "bubble-blue" },
  "red": { name: "Sunset", cost: 100, class: "bubble-red" },
  "gold": { name: "Gold", cost: 500, class: "bubble-gold" },
  "rainbow": { name: "Rainbow", cost: 1000, class: "bubble-rainbow" }
};
// Default fallback above, will be overwritten by DB

function closeModal(id) {

function openSpinWheel() {
  document.getElementById("spinModal").style.display = "flex";
  document.getElementById("spinResult").innerText = "";
  document.getElementById("spinBtn").disabled = false;
  
  // Fetch config and render wheel
  firebase.database().ref("config/wheel").once("value").then(snap => {
    const config = snap.val() || {};
    const prizes = config.prizes || [10, 50, 100, 200, 500];
    renderWheel(prizes);
  });
}

function renderWheel(prizes) {
  const wheel = document.getElementById("theWheel");
  wheel.innerHTML = ""; // Clear existing
  wheel.style.transform = "rotate(0deg)";
  
  const colors = ["#ff5252", "#ff4081", "#e040fb", "#7c4dff", "#536dfe", "#448aff", "#40c4ff", "#18ffff"];
  const segAngle = 360 / prizes.length;
  let gradientStr = "conic-gradient(";
  
  prizes.forEach((prize, i) => {
    const color = colors[i % colors.length];
    const start = i * segAngle;
    const end = (i + 1) * segAngle;
    gradientStr += `${color} ${start}deg ${end}deg, `;
    
    // Add text
    const text = document.createElement("div");
    text.className = "wheel-text";
    text.innerText = prize;
    // Rotate to center of segment, then translate out
    const rotation = start + segAngle / 2;
    text.style.transform = `rotate(${rotation}deg) translate(0, -110px) rotate(-${rotation}deg)`;
    // Note: The second rotate cancels text rotation if you want upright text, 
    // but for a wheel usually text radiates. Let's keep it radiating:
    text.style.transform = `rotate(${rotation}deg) translate(0, -110px)`;
    wheel.appendChild(text);
  });
  
  gradientStr = gradientStr.slice(0, -2) + ")";
  wheel.style.background = gradientStr;
}

function spinTheWheel() {
  const uid = firebase.auth().currentUser.uid;
  const userRef = firebase.database().ref("users/" + uid);
  const configRef = firebase.database().ref("config/wheel");
  
  Promise.all([
    userRef.child("lastSpin").once("value"),
    userRef.child("points").once("value"),
    configRef.once("value")
  ]).then(([spinSnap, pointsSnap, configSnap]) => {
    const lastSpin = spinSnap.val() || 0;
    const currentPoints = pointsSnap.val() || 0;
    const config = configSnap.val() || {};
    
    const now = Date.now();
    const cooldownHours = config.cooldown || 24;
    const cooldown = cooldownHours * 60 * 60 * 1000;

    if (now - lastSpin < cooldown) {
      const remaining = Math.ceil((cooldown - (now - lastSpin)) / (1000 * 60 * 60));
      document.getElementById("spinResult").innerText = `Please wait ${remaining} hour(s).`;
      return;
    }

    // Spin Logic
    document.getElementById("spinBtn").disabled = true;
    const prizes = config.prizes || [10, 50, 100, 200, 500];
    const prizeIndex = Math.floor(Math.random() * prizes.length);
    const prize = prizes[prizeIndex];
    
    // Calculate rotation to land on prizeIndex
    // Pointer is at 0deg (top). Segment i is at [i*segAngle, (i+1)*segAngle].
    // We need to rotate the wheel such that segment i is at top.
    // Rotation = - (center of segment i)
    const segAngle = 360 / prizes.length;
    const segmentCenter = (prizeIndex * segAngle) + (segAngle / 2);
    
    // Add extra spins (e.g. 5)
    // We want final rotation % 360 to place the segment at top.
    // Actually, since we rotate the container, if we rotate by -segmentCenter, it moves to 0.
    // To spin clockwise (positive), we target (360 - segmentCenter).
    // Add randomness within the segment (+/- 40% of width) to look natural
    const randomOffset = (Math.random() - 0.5) * (segAngle * 0.8);
    const targetRotation = (360 - segmentCenter) + randomOffset;
    const totalDeg = (5 * 360) + targetRotation;
    
    document.getElementById("theWheel").style.transform = `rotate(${totalDeg}deg)`;

    setTimeout(() => {
      // Update DB
      const newPoints = currentPoints + prize;
      userRef.update({
        points: newPoints,
        lastSpin: now
      });
      document.getElementById("spinResult").innerText = `You won ${prize} points!`;
      document.getElementById("user_points").innerText = newPoints + " 💎";
    }, 4000); // Match CSS transition time
  });
}

function openShop() {
  document.getElementById("shopModal").style.display = "flex";
  document.getElementById("shopGrid").innerHTML = "Loading shop...";
  
  // Fetch dynamic shop config
  firebase.database().ref("config/shopItems").once("value").then(snap => {
    if (snap.exists()) shopItemsData = snap.val();
    // If not exists, we use the default variable defined at top
    renderShop();
  });
}

function renderShop() {
  const uid = firebase.auth().currentUser.uid;
  const userRef = firebase.database().ref("users/" + uid);
  
  Promise.all([
    userRef.child("points").once("value"),
    userRef.child("inventory").once("value"),
    userRef.child("equipped").once("value")
  ]).then(([pSnap, iSnap, eSnap]) => {
    const points = pSnap.val() || 0;
    const inventory = iSnap.val() || { "default": true };
    const equipped = eSnap.val() || "default";

    document.getElementById("shop_balance").innerText = points;
    const grid = document.getElementById("shopGrid");
    grid.innerHTML = "";

    for (const [id, item] of Object.entries(shopItemsData)) {
      const isOwned = inventory[id];
      const isEquipped = equipped === id;
      
      const div = document.createElement("div");
      div.className = `shop-item ${isOwned ? 'owned' : ''} ${isEquipped ? 'equipped' : ''}`;
      
      let btnHtml = "";
      if (isEquipped) {
        btnHtml = `<button class="btn btn-sm btn-secondary" disabled>Equipped</button>`;
      } else if (isOwned) {
        btnHtml = `<button class="btn btn-sm btn-success" onclick="equipItem('${id}')">Equip</button>`;
      } else {
        btnHtml = `<button class="btn btn-sm btn-primary" onclick="buyItem('${id}', ${item.cost})">Buy (${item.cost})</button>`;
      }

      // Apply custom style if present, otherwise rely on class
      const styleAttr = item.style ? `style="background: ${item.style}"` : "";
      const classAttr = item.class || "";

      div.innerHTML = `
        <div class="shop-preview ${classAttr}" ${styleAttr}></div>
        <strong>${item.name}</strong>
        ${btnHtml}
      `;
      grid.appendChild(div);
    }
  });
}

function buyItem(id, cost) {
  const uid = firebase.auth().currentUser.uid;
  const userRef = firebase.database().ref("users/" + uid);
  userRef.child("points").once("value").then(snap => {
    const points = snap.val() || 0;
    if (points >= cost) {
      userRef.child("points").set(points - cost);
      userRef.child("inventory/" + id).set(true);
      renderShop(); // Refresh UI
    } else {
      alert("Not enough points!");
    }
  });
}

function openLeaderboard() {

    // Firebase returns ascending, so reverse it

function parseMarkdown(markdown) {
  if (!markdown) return '';
  return markdown
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") // Escape HTML
    .replace(/^# (.*$)/gim, '<h3 style="margin-top:10px; margin-bottom:5px; color:white;">$1</h3>') // H1 -> H3
    .replace(/^## (.*$)/gim, '<h4 style="margin-top:10px; margin-bottom:5px; color:white;">$1</h4>') // H2 -> H4
    .replace(/\*\*(.*)\*\*/gim, '<b>$1</b>') // Bold
    .replace(/\*(.*)\*/gim, '<i>$1</i>') // Italic
    .replace(/~~(.*)~~/gim, '<del>$1</del>') // Strikethrough
    .replace(/\[([^\]]+)\]\(([^)]+)\)/gim, '<a href="$2" target="_blank" style="color:var(--accent); text-decoration:underline;">$1</a>') // Links
    .replace(/^\- (.*$)/gim, '<div style="margin-left:15px;">• $1</div>') // Lists
    .replace(/\n/gim, '<br>'); // Newlines
}

function toggleUpdateLog() {

    inbox.classList.add("hidden");
    search.classList.add("hidden");
    addRoom.classList.add("hidden");
    if (btn) btn.innerText = "Open Rooms";
    
    firebase.database().ref("config/updates").limitToLast(20).once("value").then(snap => {
      if(!snap.exists()) {
          document.getElementById("update_log_content").innerHTML = "No updates yet.";
          return;
      }
      
      let html = "";
      const updates = [];
      snap.forEach(child => updates.unshift(child.val())); // Reverse order (newest first)
      
      updates.forEach(u => {
          html += `<div style="margin-bottom: 20px; border-bottom: 1px solid #555; padding-bottom: 10px;">
            <h4 style="margin-top:0; color:var(--accent);">${u.heading}</h4>
            <div>${parseMarkdown(u.description)}</div>
          </div>`;
      });
      
      document.getElementById("update_log_content").innerHTML = html;
    });
  } else {
    updateLog.classList.add("hidden");
  }
}

function searchUsers() {
  const query = document.getElementById("user_search_input").value.trim();
  if (!query) return;
  
  const resultsDiv = document.getElementById("user_search_results");
  resultsDiv.innerHTML = "<p>Searching...</p>";
  
  firebase.database().ref("users")
    .orderByChild("permanentUsername")
    .startAt(query)
    .endAt(query + "\uf8ff")
    .limitToFirst(10)
    .once("value")
    .then(snapshot => {
      resultsDiv.innerHTML = "";
      if (!snapshot.exists()) {
        resultsDiv.innerHTML = "<p>No users found.</p>";
        return;
      }
      
      const myUid = firebase.auth().currentUser.uid;
      let count = 0;
      
      snapshot.forEach(child => {
        if (count >= 10) return true; // Stop after 10 matches

        const uid = child.key;
        const data = child.val();
        
        if (uid === myUid) return;
          const div = document.createElement("div");
          div.className = "user-result-item";
          div.innerHTML = `
            <div>
              <div style="font-weight:bold">${data.displayName || "User"}</div>
              <div style="font-size:0.85rem;color:#ccc">@${data.permanentUsername || "unknown"}</div>
            </div>
            <button onclick="sendPMRequest('${uid}', '${data.displayName || data.permanentUsername}')">Message</button>
          `;
          resultsDiv.appendChild(div);
          count++;
      });
      
      if (count === 0) {
         resultsDiv.innerHTML = "<p>No other users found.</p>";
      }
    })
    .catch(err => {
      console.error(err);
      resultsDiv.innerHTML = "<p style='color:red'>Error searching users.</p>";
    });
}

function sendPMRequest(targetUID, targetName) {
  const currentUser = firebase.auth().currentUser;
  if (!currentUser) return;
  
  const myUID = currentUser.uid;
  const myName = currentUserData.displayName || currentUserData.permanentUsername || "User";

  if (!confirm(`Send private message request to ${targetName}?`)) return;

  firebase.database().ref(`pm_requests/${targetUID}/${myUID}`).set({
      fromUID: myUID,
      fromName: myName,
      timestamp: firebase.database.ServerValue.TIMESTAMP
  }).then(() => {
      alert("Request sent!");
  }).catch(e => {
      alert("Error: " + e.message);
  });
}

const notificationFavicon = "TWL O NOTIFICATION.ico";

function loadInbox() {
  const uid = firebase.auth().currentUser.uid;
  
  // Requests
  firebase.database().ref('pm_requests/' + uid).on('value', snap => {
    const div = document.getElementById('pm_requests_list');
    div.innerHTML = '';
    if (!snap.exists()) {
      div.innerHTML = '<p class="text-muted">No pending requests.</p>';
      return;
    }
    snap.forEach(child => {
      const req = child.val();
      const el = document.createElement('div');
      el.className = 'request-item';
      el.innerHTML = `
        <span><strong>${req.fromName}</strong> wants to message you.</span>
        <div class="request-actions">
          <button class="btn btn-success btn-sm" onclick="acceptRequest('${child.key}', '${req.fromName}')">Accept</button>
          <button class="btn btn-danger btn-sm" onclick="rejectRequest('${child.key}')">Decline</button>
        </div>
      `;
      div.appendChild(el);
    });
  });

  // Chats
  firebase.database().ref('users/' + uid + '/private_chats').on('value', snap => {
    const div = document.getElementById('pm_chats_list');
    div.innerHTML = '';
    if (!snap.exists()) {
      div.innerHTML = '<p class="text-muted">No active chats.</p>';
      return;
    }
    snap.forEach(child => {
      const chat = child.val();
      const otherUID = child.key;
      const el = document.createElement('div');
      el.className = 'chat-item';
      el.innerHTML = `
        <span>Chat with <strong>${chat.name}</strong></span>
        <div>
          <button class="btn btn-primary btn-sm" onclick="event.stopPropagation(); openPrivateChat('${chat.roomId}')">Open</button>
          <button class="btn btn-danger btn-sm" onclick="event.stopPropagation(); deletePrivateChat('${otherUID}', '${chat.roomId}')" style="margin-left:5px;">Delete</button>
        </div>
      `;
      el.onclick = () => openPrivateChat(chat.roomId);
      div.appendChild(el);
    });
  });
}

function deletePrivateChat(otherUID, roomId) {
  if (!confirm("Delete this chat? If both users delete it, the history will be removed.")) return;
  const uid = firebase.auth().currentUser.uid;
  firebase.database().ref('users/' + uid + '/private_chats/' + otherUID).remove()
    .then(() => {
      return firebase.database().ref('users/' + otherUID + '/private_chats/' + uid).once('value');
    })
    .then(snap => {
      if (!snap.exists()) {
        firebase.database().ref('rooms/' + roomId).remove();
        firebase.database().ref('room-messages/' + roomId).remove();
        firebase.database().ref('room-typing/' + roomId).remove();
        firebase.database().ref('room-read-receipts/' + roomId).remove();
      }
    })
    .catch(e => alert(e.message));
}

function acceptRequest(senderUID, senderName) {
  const uid = firebase.auth().currentUser.uid;
  const myName = currentUserData.displayName || currentUserData.permanentUsername || "User";
  
  // Sort UIDs to create consistent Room ID
  const uids = [uid, senderUID].sort();
  const roomId = 'dm_' + uids.join('_');
  
  const updates = {};
  // Create Room Metadata
  updates['rooms/' + roomId] = {
    type: 'dm',
    members: { [uid]: true, [senderUID]: true },
    createdAt: firebase.database.ServerValue.TIMESTAMP
  };
  
  // Add to my chats
  updates['users/' + uid + '/private_chats/' + senderUID] = {
    roomId: roomId,
    name: senderName
  };
  
  // Add to sender chats
  updates['users/' + senderUID + '/private_chats/' + uid] = {
    roomId: roomId,
    name: myName
  };
  
  // Remove request
  updates['pm_requests/' + uid + '/' + senderUID] = null;
  
  firebase.database().ref().update(updates).then(() => {
    alert("Request accepted!");
  }).catch(e => alert(e.message));
}

function rejectRequest(senderUID) {
  const uid = firebase.auth().currentUser.uid;
  firebase.database().ref('pm_requests/' + uid + '/' + senderUID).remove();
}

    function joinRoom(roomName) {
      roomsRef.child(roomName).once("value").then(function(snapshot) {
        let roomData = snapshot.val();
        let passwordInputField = document.getElementById(`password_${roomName}`);
        let errorBanner = document.getElementById(`error_${roomName}`);

        if (roomData.type === "private") {
          let password = passwordInputField.value;
          if (password === roomData.password) {
            localStorage.setItem("room_name", roomName);
            localStorage.setItem("room_password", password);
            window.location.href = "ch.html";
          } else {
            if (!errorBanner) {
              let errorElement = document.createElement('div');
              errorElement.id = `error_${roomName}`;
              errorElement.classList.add('password-error');
              errorElement.textContent = 'Incorrect password!';
              passwordInputField.parentElement.appendChild(errorElement);
            }
            localStorage.removeItem("room_name");
            localStorage.removeItem("room_password");
          }
        } else {
          localStorage.setItem("room_name", roomName);
          localStorage.removeItem("room_password");
          window.location.href = "ch.html";
        }
      });
    }

      window.location.href = "settings.html"
    }

        window.location.href = "index.html";

        console.error("Logout error:", error);
