<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Waffle Breaker</title>
<style>
    @import url("https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700&display=swap");
    body {
        margin: 0; padding: 0;
        background-color: #202225;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
    }
    canvas {
        background-color: #2f3136;
        border-radius: 8px;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    #ui-layer {
        position: absolute;
        color: white;
        text-align: center;
        pointer-events: none;
    }
    #score { font-size: 3em; font-weight: 700; text-shadow: 3px 3px 0 rgba(0,0,0,0.2); }
    #message-box {
        display: none;
        background: rgba(0,0,0,0.8);
        padding: 20px 40px;
        border-radius: 15px;
        pointer-events: auto;
    }
    #message-box h1 { color: #faa61a; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div id="ui-layer">
    <div id="score">0</div>
    <div id="challenge-info" style="display:none; color:#ffd700; font-size:1.2em; font-weight:bold; text-shadow: 1px 1px 0 #000; margin-top: 5px;">Challenge: Points = Score / 2.8</div>
    <div id="message-box">
        <h1 id="message-title">Game Over</h1>
        <p id="message-text">Click to restart</p>
        <button onclick="finishChallenge()" id="finish-challenge-btn" style="display:none; background:#43b581; border:none; padding:10px; border-radius:5px; color:white; font-weight:bold; margin-top:10px; pointer-events:auto;">Collect Points & Exit</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = Math.min(window.innerWidth - 20, 500);
    canvas.height = Math.min(window.innerHeight - 20, 600);

    let score, highScore, balls, paddle, bricks, isGameOver;
    highScore = localStorage.getItem('waffleBreakerHigh') || 0;
    const urlParams = new URLSearchParams(window.location.search);
    const isChallenge = urlParams.get('challenge') === 'true';
    const isInfinite = urlParams.get('mode') === 'infinite';

    const brickRowCount = 8;
    const brickColumnCount = 8;
    const brickPadding = 10;
    const brickOffsetTop = 60;
    const brickHeight = 35;
    const brickWidth = (canvas.width - (brickColumnCount + 1) * brickPadding) / brickColumnCount;
    const brickOffsetLeft = brickPadding;

    function init() {
        score = 0;
        isGameOver = false;
        balls = [{ x: canvas.width / 2, y: canvas.height - 50, dx: 4, dy: -4, radius: 10 }];
        paddle = { x: canvas.width / 2 - 50, y: canvas.height - 20, width: 100, height: 10 };
        bricks = [];
        resetBricks();
        document.getElementById('score').innerText = score;
        document.getElementById('message-box').style.display = 'none';
        loop();
        if (isChallenge) {
            document.getElementById('challenge-info').style.display = 'block';
        }
    }

    function resetBricks() {
        for (let c = 0; c < brickColumnCount; c++) {
            bricks[c] = [];
            for (let r = 0; r < brickRowCount; r++) {
                bricks[c][r] = { x: 0, y: 0, status: 1, health: Math.floor(Math.random() * 3) + 1 };
            }
        }
    }

    function drawBalls() {
        balls.forEach(ball => {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#faa61a';
            ctx.fill();
            ctx.closePath();
        });
    }

    function drawPaddle() {
        ctx.beginPath();
        ctx.rect(paddle.x, paddle.y, paddle.width, paddle.height);
        ctx.fillStyle = '#7289da';
        ctx.fill();
        ctx.closePath();
    }

    function drawBricks() {
        for (let c = 0; c < brickColumnCount; c++) {
            for (let r = 0; r < brickRowCount; r++) {
                if (bricks[c][r].status === 1) {
                    const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                    const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                    bricks[c][r].x = brickX;
                    bricks[c][r].y = brickY;
                    ctx.beginPath();
                    ctx.rect(brickX, brickY, brickWidth, brickHeight);
                    // Color based on health
                    if (bricks[c][r].health === 3) ctx.fillStyle = '#ff4081'; // Red-ish
                    else if (bricks[c][r].health === 2) ctx.fillStyle = '#faa61a'; // Orange
                    else ctx.fillStyle = '#e6a15c'; // Waffle color
                    ctx.fill();
                    ctx.closePath();
                }
            }
        }
    }

    function collisionDetection() {
        for (let c = 0; c < brickColumnCount; c++) {
            for (let r = 0; r < brickRowCount; r++) {
                const b = bricks[c][r];
                if (b.status === 1) {
                    balls.forEach(ball => {
                        if (ball.x > b.x && ball.x < b.x + brickWidth && ball.y > b.y && ball.y < b.y + brickHeight) {
                            ball.dy = -ball.dy;
                            b.health--;
                            if (b.health <= 0) {
                                b.status = 0;
                                score++;
                                document.getElementById('score').innerText = score;
                                
                                // Check win/reset condition
                                if (checkAllBricksCleared()) {
                                    if (isInfinite) resetBricks();
                                    else winGame();
                                }
                            }
                        }
                    });
                }
            }
        }
    }

    function checkAllBricksCleared() {
        for(let c=0; c<brickColumnCount; c++) {
            for(let r=0; r<brickRowCount; r++) {
                if(bricks[c][r].status === 1) return false;
            }
        }
        return true;
    }

    function loop() {
        if (isGameOver) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBricks();
        drawBalls();
        drawPaddle();
        collisionDetection();

        // Randomly spawn a new ball (0.1% chance per frame)
        if (Math.random() < 0.005) {
            balls.push({ x: canvas.width / 2, y: canvas.height / 2, dx: (Math.random() > 0.5 ? 4 : -4), dy: -4, radius: 10 });
            const brickBottom = brickOffsetTop + (brickRowCount * (brickHeight + brickPadding));
            const spawnY = Math.max(brickBottom + 30, canvas.height * 0.6);
            const spawnX = Math.random() * (canvas.width - 40) + 20;
            balls.push({ x: spawnX, y: spawnY, dx: (Math.random() > 0.5 ? 4 : -4), dy: -4, radius: 10 });
        }

        for (let i = balls.length - 1; i >= 0; i--) {
            let ball = balls[i];
            
            if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) ball.dx = -ball.dx;
            
            if (ball.y + ball.dy < ball.radius) ball.dy = -ball.dy;
            else if (ball.y + ball.dy > canvas.height - ball.radius) {
                if (ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                    ball.dy = -ball.dy;
                    // Speed up slightly on paddle hit
                    ball.dx *= 1.05;
                    ball.dy *= 1.05;
                } else {
                    // Ball lost
                    balls.splice(i, 1);
                    if (balls.length === 0) {
                        gameOver();
                    }
                }
            }
            
            if (balls[i]) { // Check if ball still exists
                ball.x += ball.dx;
                ball.y += ball.dy;
            }
        }

        requestAnimationFrame(loop);
    }

    function gameOver() {
        isGameOver = true;
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('waffleBreakerHigh', highScore);
        }
        document.getElementById('message-title').innerText = 'Game Over';
        document.getElementById('message-text').innerText = `Score: ${score} | Best: ${highScore}\nClick to restart`;
        document.getElementById('message-box').style.display = 'block';
        if (isChallenge) {
            document.getElementById('message-text').innerText = `Score: ${score}`;
            document.getElementById('finish-challenge-btn').style.display = 'block';
        }
    }

    function winGame() {
        isGameOver = true;
        document.getElementById('message-title').innerText = 'You Win!';
        document.getElementById('message-text').innerText = `Score: ${score}\nClick to play again`;
        document.getElementById('message-box').style.display = 'block';
        if (isChallenge) {
            document.getElementById('finish-challenge-btn').style.display = 'block';
        }
    }

    canvas.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        let newX = e.clientX - rect.left - paddle.width / 2;
        if (newX > 0 && newX < canvas.width - paddle.width) {
            paddle.x = newX;
        }
    });

    canvas.addEventListener('click', () => { 
        if (isChallenge && isGameOver) return;
        if (isGameOver) init(); 
    });

    function finishChallenge() {
        window.parent.postMessage({ type: 'GAME_OVER', score: score }, '*');
        window.parent.postMessage({ type: 'GAME_OVER', score: Math.floor(score / 2.8) }, '*');
    }

    init();
</script>
</body>
</html>
