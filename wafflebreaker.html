<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Waffle Breaker</title>
<style>
    @import url("https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700&display=swap");
    body {
        margin: 0; padding: 0;
        background-color: #202225;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: "Be Vietnam Pro", sans-serif;
        overflow: hidden;
    }
    canvas {
        background-color: #2f3136;
        border-radius: 8px;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    #ui-layer {
        position: absolute;
        color: white;
        text-align: center;
        pointer-events: none;
    }
    #score { font-size: 3em; font-weight: 700; text-shadow: 3px 3px 0 rgba(0,0,0,0.2); }
    #message-box {
        display: none;
        background: rgba(0,0,0,0.8);
        padding: 20px 40px;
        border-radius: 15px;
        pointer-events: auto;
    }
    #message-box h1 { color: #faa61a; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div id="ui-layer">
    <div id="score">0</div>
    <div id="message-box">
        <h1 id="message-title">Game Over</h1>
        <p id="message-text">Click to restart</p>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = Math.min(window.innerWidth - 20, 500);
    canvas.height = Math.min(window.innerHeight - 20, 600);

    let score, highScore, ball, paddle, bricks, isGameOver;
    highScore = localStorage.getItem('waffleBreakerHigh') || 0;

    const brickRowCount = 6;
    const brickColumnCount = 7;
    const brickWidth = (canvas.width - 80) / brickColumnCount;
    const brickHeight = 20;
    const brickPadding = 10;
    const brickOffsetTop = 50;
    const brickOffsetLeft = 40;

    function init() {
        score = 0;
        isGameOver = false;
        ball = { x: canvas.width / 2, y: canvas.height - 50, dx: 4, dy: -4, radius: 10 };
        paddle = { x: canvas.width / 2 - 50, y: canvas.height - 20, width: 100, height: 10 };
        bricks = [];
        for (let c = 0; c < brickColumnCount; c++) {
            bricks[c] = [];
            for (let r = 0; r < brickRowCount; r++) {
                bricks[c][r] = { x: 0, y: 0, status: 1 };
            }
        }
        document.getElementById('score').innerText = score;
        document.getElementById('message-box').style.display = 'none';
        loop();
    }

    function drawBall() {
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#faa61a';
        ctx.fill();
        ctx.closePath();
    }

    function drawPaddle() {
        ctx.beginPath();
        ctx.rect(paddle.x, paddle.y, paddle.width, paddle.height);
        ctx.fillStyle = '#7289da';
        ctx.fill();
        ctx.closePath();
    }

    function drawBricks() {
        for (let c = 0; c < brickColumnCount; c++) {
            for (let r = 0; r < brickRowCount; r++) {
                if (bricks[c][r].status === 1) {
                    const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                    const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                    bricks[c][r].x = brickX;
                    bricks[c][r].y = brickY;
                    ctx.beginPath();
                    ctx.rect(brickX, brickY, brickWidth, brickHeight);
                    ctx.fillStyle = '#e6a15c';
                    ctx.fill();
                    ctx.closePath();
                }
            }
        }
    }

    function collisionDetection() {
        for (let c = 0; c < brickColumnCount; c++) {
            for (let r = 0; r < brickRowCount; r++) {
                const b = bricks[c][r];
                if (b.status === 1) {
                    if (ball.x > b.x && ball.x < b.x + brickWidth && ball.y > b.y && ball.y < b.y + brickHeight) {
                        ball.dy = -ball.dy;
                        b.status = 0;
                        score++;
                        document.getElementById('score').innerText = score;
                        if (score === brickRowCount * brickColumnCount) {
                            winGame();
                        }
                    }
                }
            }
        }
    }

    function loop() {
        if (isGameOver) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBricks();
        drawBall();
        drawPaddle();
        collisionDetection();

        if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) ball.dx = -ball.dx;
        if (ball.y + ball.dy < ball.radius) ball.dy = -ball.dy;
        else if (ball.y + ball.dy > canvas.height - ball.radius) {
            if (ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                ball.dy = -ball.dy;
            } else {
                gameOver();
            }
        }

        ball.x += ball.dx;
        ball.y += ball.dy;
        requestAnimationFrame(loop);
    }

    function gameOver() {
        isGameOver = true;
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('waffleBreakerHigh', highScore);
        }
        document.getElementById('message-title').innerText = 'Game Over';
        document.getElementById('message-text').innerText = `Score: ${score} | Best: ${highScore}\nClick to restart`;
        document.getElementById('message-box').style.display = 'block';
    }

    function winGame() {
        isGameOver = true;
        document.getElementById('message-title').innerText = 'You Win!';
        document.getElementById('message-text').innerText = `Score: ${score}\nClick to play again`;
        document.getElementById('message-box').style.display = 'block';
    }

    canvas.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        let newX = e.clientX - rect.left - paddle.width / 2;
        if (newX > 0 && newX < canvas.width - paddle.width) {
            paddle.x = newX;
        }
    });

    canvas.addEventListener('click', () => { if (isGameOver) init(); });

    init();
</script>
</body>
</html>
