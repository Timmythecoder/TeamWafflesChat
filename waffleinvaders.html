<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waffle Invaders</title>
<style>
    body { margin: 0; background: #202225; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    canvas { background: #2f3136; border: 2px solid #faa61a; border-radius: 8px; }
</style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="600"></canvas>
<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let player = { x: 180, y: 550, w: 40, h: 20, color: '#faa61a' };
    let bullets = [];
    let enemies = [];
    let score = 0;
    let gameOver = false;
    let frame = 0;
    let highScore = localStorage.getItem('waffleInvadersHigh') || 0;

    function init() {
        score = 0;
        gameOver = false;
        bullets = [];
        enemies = [];
        player.x = 180;
        loop();
    }

    function spawnEnemy() {
        const size = 30;
        const x = Math.random() * (canvas.width - size);
        enemies.push({ x: x, y: -size, w: size, h: size, speed: 2 + Math.random() * 2 });
    }

    function update() {
        if (gameOver) return;
        frame++;

        // Spawn enemies
        if (frame % 60 === 0) spawnEnemy();

        // Move bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].y -= 7;
            if (bullets[i].y < 0) bullets.splice(i, 1);
        }

        // Move enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
            enemies[i].y += enemies[i].speed;
            
            // Collision with player
            if (rectIntersect(player, enemies[i])) {
                setGameOver();
            }

            // Collision with bullets
            for (let j = bullets.length - 1; j >= 0; j--) {
                if (rectIntersect(bullets[j], enemies[i])) {
                    enemies.splice(i, 1);
                    bullets.splice(j, 1);
                    score += 10;
                    break;
                }
            }

            if (enemies[i] && enemies[i].y > canvas.height) {
                setGameOver(); // Game over if enemy passes
            }
        }
    }

    function setGameOver() {
        if (gameOver) return;
        gameOver = true;
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('waffleInvadersHigh', highScore);
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Player
        ctx.fillStyle = player.color;
        ctx.fillRect(player.x, player.y, player.w, player.h);

        // Bullets
        ctx.fillStyle = '#fff';
        bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

        // Enemies
        ctx.fillStyle = '#e6a15c'; // Waffle color
        enemies.forEach(e => {
            ctx.fillRect(e.x, e.y, e.w, e.h);
            ctx.fillStyle = '#8B4513'; // Syrup
            ctx.fillRect(e.x + 5, e.y + 5, e.w - 10, e.h - 10);
            ctx.fillStyle = '#e6a15c';
        });

        // Score
        ctx.fillStyle = 'white';
        ctx.font = '20px Arial';
        ctx.fillText('Score: ' + score, 10, 30);
        ctx.fillText('Best: ' + highScore, 10, 60);

        if (gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#faa61a';
            ctx.font = '40px Arial';
            ctx.fillText('Game Over', 100, 300);
            ctx.font = '20px Arial';
            ctx.fillText('Score: ' + score, 130, 340);
            ctx.fillText('Best: ' + highScore, 130, 370);
            ctx.fillText('Click to Restart', 130, 410);
        }
    }

    function rectIntersect(r1, r2) {
        return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x || r2.y > r1.y + r1.h || r2.y + r2.h < r1.y);
    }

    function loop() {
        update();
        draw();
        if (!gameOver) requestAnimationFrame(loop);
    }

    canvas.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        player.x = e.clientX - rect.left - player.w / 2;
    });

    canvas.addEventListener('click', () => {
        if (gameOver) init();
        else bullets.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 4, h: 10 });
    });

    init();
</script>
</body>
</html>
