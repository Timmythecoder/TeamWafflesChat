<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Waffles - Login/Sign Up</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">

   
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>

<body>
    <div class="auth-container">
        <div class="logo">
            <img src="TWL O - Copy.png" alt="Team Waffles Logo">
        </div>

        <h2 id="form-title">Sign In</h2>
        <h3 id="form-subtitle">A verification email will be sent to the email you signup with</h3>

        <div class="error-message" id="error-message"></div>
        <div class="success-message" id="success-message"></div>

        <input type="email" id="email" placeholder="Enter your email" required>
        <input type="password" id="password" placeholder="Enter your password" required>


        <div class="g-recaptcha" data-sitekey="6Lf-6fwrAAAAAC8z64ODrxnDG6da2DM_ZYdsQpzG"></div>



        <!-- Continue with Google -->
        <div class="google-login">
            <button id="googleSignInBtn" onclick="signInWithGoogle()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo">
                Continue with Google
            </button>
        </div>

        <br>



        <button id="auth-button" onclick="authAction()">Sign In</button>

        <div class="loading-spinner" id="loading-spinner">
            <video autoplay loop muted>
                <source src="Loading.mp4" type="video/mp4"> 
                Your browser does not support the video tag.
            </video>
        </div>

        <div class="toggle-text" id="toggle-text">
            Don't have an account? <a href="#" onclick="toggleForm()">Sign Up</a>
        </div>
    </div>

    <!-- Back to Team Waffles Website Button -->
    <a href="https://bit.ly/teamwaffleswebsite" class="home-button"></a>

    <script src="https://www.gstatic.com/firebasejs/7.6.2/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.6.2/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.6.2/firebase-database.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/js/bootstrap.min.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage.js"></script>

    <script>
        function authAction() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const captchaResponse = grecaptcha.getResponse();
            const errorMsg = document.getElementById("error-message");

      
            if (captchaResponse.length === 0) {
                errorMsg.innerText = "Please verify the reCAPTCHA before continuing.";
                return;
            }

  
            document.getElementById("loading-spinner").style.display = "block";


            firebase.auth().signInWithEmailAndPassword(email, password)
                .then(() => {
                    document.getElementById("loading-spinner").style.display = "none";
                    window.location.href = "dashboard.html"; // Redirect after successful login
                })
                .catch((error) => {
                    document.getElementById("loading-spinner").style.display = "none";
                    errorMsg.innerText = error.message;
                    grecaptcha.reset(); // reset reCAPTCHA after error
                });
        }
    </script>

    <script src="teamwafflesauth.js"></script>
</body>

</html>
