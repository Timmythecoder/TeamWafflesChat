<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waffle Pong</title>
<style>
    @import url("https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700&display=swap");
    body { margin: 0; background: #202225; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: "Be Vietnam Pro", sans-serif; overflow: hidden; }
    canvas { background: #2f3136; border: 2px solid #faa61a; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    #score { position: absolute; top: 20px; color: white; font-size: 40px; font-weight: bold; pointer-events: none; }
</style>
</head>
<body>
<div id="score">0 - 0</div>
<canvas id="gameCanvas" width="600" height="400"></canvas>
<button onclick="finishChallenge()" id="finish-challenge-btn" style="display:none; position:absolute; bottom:20px; background:#43b581; border:none; padding:10px 20px; border-radius:5px; color:white; font-weight:bold; cursor:pointer;">Collect Points & Exit</button>
<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const ball = { x: 300, y: 200, r: 10, dx: 5, dy: 5 };
    const paddleH = 80, paddleW = 10;
    const user = { x: 0, y: 160, score: 0 };
    const com = { x: canvas.width - 10, y: 160, score: 0 };
    const urlParams = new URLSearchParams(window.location.search);
    const isChallenge = urlParams.get('challenge') === 'true';
    
    if (isChallenge) {
        document.getElementById('finish-challenge-btn').style.display = 'block';
    }
    
    function drawRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(x, y, w, h);
    }
    
    function drawCircle(x, y, r, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI*2, false);
        ctx.closePath();
        ctx.fill();
    }
    
    function drawText(text, x, y) {
        ctx.fillStyle = "#FFF";
        ctx.font = "40px 'Be Vietnam Pro'";
        ctx.fillText(text, x, y);
    }
    
    function resetBall() {
        ball.x = canvas.width/2;
        ball.y = canvas.height/2;
        ball.dx = -ball.dx;
        ball.dy = 5 * (Math.random() > 0.5 ? 1 : -1);
    }
    
    function update() {
        ball.x += ball.dx;
        ball.y += ball.dy;
        
        if(ball.y + ball.r > canvas.height || ball.y - ball.r < 0) ball.dy = -ball.dy;
        
        let player = (ball.x < canvas.width/2) ? user : com;
        
        if(collision(ball, player)) {
            let collidePoint = (ball.y - (player.y + paddleH/2));
            collidePoint = collidePoint / (paddleH/2);
            let angleRad = (Math.PI/4) * collidePoint;
            let direction = (ball.x < canvas.width/2) ? 1 : -1;
            ball.dx = direction * 8 * Math.cos(angleRad);
            ball.dy = 8 * Math.sin(angleRad);
            // Speed up
            if(Math.abs(ball.dx) < 15) { ball.dx *= 1.1; ball.dy *= 1.1; }
        }
        
        // AI
        com.y += ((ball.y - (com.y + paddleH/2))) * 0.1;
        
        // Score
        if(ball.x - ball.r < 0) {
            com.score++;
            resetBall();
        } else if(ball.x + ball.r > canvas.width) {
            user.score++;
            resetBall();
        }

        document.getElementById('score').innerText = user.score + " - " + com.score;
    }
    
    function collision(b, p) {
        b.top = b.y - b.r; b.bottom = b.y + b.r; b.left = b.x - b.r; b.right = b.x + b.r;
        p.top = p.y; p.bottom = p.y + paddleH; p.left = p.x; p.right = p.x + paddleW;
        return b.right > p.left && b.bottom > p.top && b.left < p.right && b.top < p.bottom;
    }
    
    function render() {
        drawRect(0, 0, canvas.width, canvas.height, "#2f3136");
        drawRect(user.x, user.y, paddleW, paddleH, "#faa61a");
        drawRect(com.x, com.y, paddleW, paddleH, "#faa61a");
        drawCircle(ball.x, ball.y, ball.r, "#e6a15c");
    }
    
    function game() {
        update();
        render();
    }
    
    canvas.addEventListener("mousemove", getMousePos);
    function getMousePos(evt) {
        let rect = canvas.getBoundingClientRect();
        user.y = evt.clientY - rect.top - paddleH/2;
    }
    
    setInterval(game, 1000/60);
    
    function finishChallenge() {
        window.parent.postMessage({ type: 'GAME_OVER', score: user.score }, '*');
    }
</script>
</body>
</html>
