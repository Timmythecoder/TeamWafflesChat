<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Badge Panel with Profile Pictures</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
    h1, h2 { color: #333; }
    .section {
      background: #fff; padding: 15px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #ccc;
    }
    .user, .badge-item {
      background: #fafafa; padding: 10px; margin-bottom: 10px;
      border: 1px solid #ddd; border-radius: 6px;
    }
    .user-info, .badge-name {
      font-weight: bold; margin-bottom: 6px;
    }
    .badges { margin-bottom: 6px; }
    .badge {
      display: inline-block; background: #007bff; color: white;
      padding: 4px 8px; border-radius: 5px; margin: 2px;
      user-select: none; cursor: default; position: relative;
    }
    .badge:hover .tooltip { display: block; }
    .tooltip {
      display: none; position: absolute; bottom: 125%; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.8); color: #fff; padding: 5px 8px;
      border-radius: 4px; font-size: 12px; white-space: nowrap; z-index: 10;
    }
    input[type="text"], textarea, select {
      margin-top: 5px; padding: 6px; font-size: 14px; width: 100%;
      box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc;
    }
    button {
      margin-top: 5px; cursor: pointer; padding: 6px 12px;
      border-radius: 4px; border: none; background-color: #007bff;
      color: white; font-weight: bold;
    }
    button.remove { background-color: #dc3545; }
  </style>
</head>
<body>
  <div id="pinOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#333;z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;color:white;">
    <h2>Admin Access</h2>
    <p>Please enter the admin PIN to continue.</p>
    <input type="password" id="adminPinInput" placeholder="Enter PIN" style="padding:10px;font-size:16px;border-radius:5px;border:none;margin-bottom:10px;color:black;width:200px;">
    <button id="verifyPinBtn" style="padding:10px 20px;font-size:16px;cursor:pointer;">Enter</button>
  </div>

  <h1>Admin Panel - Badge & Profile Picture Management</h1>

  <div class="section" id="badge-list-section">
    <h2>Badge List</h2>
    <button id="loadBadgesBtn" style="margin-bottom: 10px;">Load Badges</button>
    <div id="badges"></div>
    <h3>Add New Badge</h3>
    <input type="text" id="newBadgeName" placeholder="Badge ID (unique, no spaces)" />
    <input type="text" id="newBadgeDisplayName" placeholder="Badge Display Name" />
    <textarea id="newBadgeDescription" rows="2" placeholder="Badge Description"></textarea>
    <button id="addBadgeBtn">Add Badge</button>
  </div>

  <div class="section" id="user-list-section">
    <h2>Users</h2>
    <button id="loadUsersBtn" style="margin-bottom: 10px;">Load Users</button>
    <div id="users"></div>
  </div>

  <div class="section" id="wheel-config-section">
    <h2>Wheel Configuration</h2>
    <button id="loadWheelBtn" style="margin-bottom: 10px;">Load Config</button><br>
    <label>Prizes (comma separated numbers):</label>
    <input type="text" id="wheelPrizes" placeholder="10, 50, 100, 200, 500">
    <label>Cooldown (hours):</label>
    <input type="number" id="wheelCooldown" placeholder="24">
    <button id="saveWheelConfigBtn">Save Wheel Config</button>
  </div>

  <div class="section" id="shop-config-section">
    <h2>Shop Configuration</h2>
    <button id="loadShopBtn" style="margin-bottom: 10px;">Load Shop</button>
    
    <div style="background:#e9ecef; padding:10px; margin-bottom:15px; border-radius:5px;">
      <h4>Add New Item</h4>
      <input type="text" id="newShopId" placeholder="ID (e.g. green)" style="width:100px;">
      <input type="text" id="newShopName" placeholder="Name (e.g. Matrix)" style="width:120px;">
      <input type="number" id="newShopCost" placeholder="Cost" style="width:80px;">
      <input type="text" id="newShopStyle" placeholder="CSS Background (e.g. green or linear-gradient...)" style="width:250px;">
      <button id="addShopItemBtn">Add Item</button>
    </div>

    <div id="shopItemsList"></div>
    <button id="saveShopConfigBtn" style="margin-top:10px;">Save Shop Changes</button>
  </div>

  <div class="section" id="allowed-pics-section">
    <h2>Allowed Profile Pictures</h2>
    <button id="loadPicsBtn" style="margin-bottom: 10px;">Load Pictures</button>
    <div id="allowedPicsList" style="display: flex; flex-wrap: wrap; gap: 10px;"></div>
    <input type="text" id="newAllowedPic" placeholder="Paste image URL or Base64 string" />
    <button id="addAllowedPicBtn">Add Allowed Picture</button>
  </div>

  <div class="section" id="update-log-section">
    <h2>Manage Updates</h2>
    <button id="loadUpdatesBtn" style="margin-bottom: 10px;">Load Updates</button>
    <div id="updatesList"></div>
    <h3>Add New Update</h3>
    <input type="text" id="updateLogHeading" placeholder="Update Heading (e.g. v1.0 Released)" />
    <textarea id="updateLogDescription" rows="5" placeholder="Update Description"></textarea>
    <button id="saveUpdateLogBtn">Post Update</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getDatabase, ref, get, set, update, remove, query, limitToLast } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCfTDFXdh1tifQIyY6415IORbdXIffYUJ4",
      authDomain: "team-waffles.firebaseapp.com",
      databaseURL: "https://team-waffles-default-rtdb.firebaseio.com",
      projectId: "team-waffles",
      storageBucket: "team-waffles.appspot.com",
      messagingSenderId: "891460090478",
      appId: "1:891460090478:web:c01b6db1af21745769047f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    async function loadBadges() {
      const container = document.getElementById("badges");
      container.innerHTML = "Loading...";
      const snap = await get(ref(db, "badges"));
      container.innerHTML = "";
      if (!snap.exists()) return container.innerHTML = "<p>No badges found.</p>";
      const badges = snap.val();
      for (const [id, data] of Object.entries(badges)) {
        const div = document.createElement("div");
        div.className = "badge-item";
        div.innerHTML = `<div class='badge-name'>${id} (${data.name})</div><p>${data.description || "No description"}</p>`;
        const btn = document.createElement("button");
        btn.textContent = "Remove Badge";
        btn.className = "remove";
        btn.onclick = async () => {
          if (confirm(`Delete badge '${id}'?`)) {
            await remove(ref(db, `badges/${id}`));
            loadBadges();
          }
        };
        div.appendChild(btn);
        container.appendChild(div);
      }
    }

    async function loadUsers() {
      const container = document.getElementById("users");
      container.innerHTML = "Loading...";
      const [usersSnap, badgesSnap] = await Promise.all([
        get(query(ref(db, "users"), limitToLast(50))),
        get(ref(db, "badges")),
      ]);
      container.innerHTML = "";
      const badges = badgesSnap.exists() ? badgesSnap.val() : {};
      if (!usersSnap.exists()) return container.innerHTML = "<p>No users found.</p>";
      const users = usersSnap.val();

      for (const [uid, userData] of Object.entries(users)) {
        const div = document.createElement("div");
        div.className = "user";
        div.innerHTML = `<div class='user-info'>UID: ${uid} — Username: ${userData.permanentUsername || "(none)"}</div>`;

        const badgeContainer = document.createElement("div");
        badgeContainer.className = "badges";
        (userData.badges || []).forEach(badgeId => {
          const span = document.createElement("span");
          span.className = "badge";
          span.textContent = badges[badgeId]?.name || badgeId;
          badgeContainer.appendChild(span);
        });
        div.appendChild(badgeContainer);

        // Points Management
        const pointsDiv = document.createElement("div");
        pointsDiv.style.marginTop = "5px";
        pointsDiv.innerHTML = `Points: <strong>${userData.points || 0}</strong> `;
        
        const btnAddPoints = document.createElement("button");
        btnAddPoints.textContent = "+100 Pts";
        btnAddPoints.onclick = async () => {
            await update(ref(db, `users/${uid}`), { points: (userData.points || 0) + 100 });
            loadUsers();
        };
        const btnSubPoints = document.createElement("button");
        btnSubPoints.textContent = "-100 Pts";
        btnSubPoints.className = "remove";
        btnSubPoints.onclick = async () => {
            await update(ref(db, `users/${uid}`), { points: Math.max(0, (userData.points || 0) - 100) });
            loadUsers();
        };
        pointsDiv.appendChild(btnAddPoints);
        pointsDiv.appendChild(btnSubPoints);
        div.appendChild(pointsDiv);

        const addSelect = document.createElement("select");
        const addDefault = document.createElement("option");
        addDefault.text = "Select badge to add";
        addSelect.appendChild(addDefault);
        Object.entries(badges).forEach(([id, badge]) => {
          if ((userData.badges || []).includes(id)) return;
          const opt = document.createElement("option");
          opt.value = id;
          opt.text = badge.name;
          addSelect.appendChild(opt);
        });
        const addBtn = document.createElement("button");
        addBtn.textContent = "Add Badge";
        addBtn.onclick = async () => {
          const val = addSelect.value;
          if (!val) return alert("Select a badge");
          const updated = [...(userData.badges || []), val];
          await update(ref(db, `users/${uid}`), { badges: updated });
          loadUsers();
        };

        const removeSelect = document.createElement("select");
        const removeDefault = document.createElement("option");
        removeDefault.text = "Select badge to remove";
        removeSelect.appendChild(removeDefault);
        (userData.badges || []).forEach(badgeId => {
          const opt = document.createElement("option");
          opt.value = badgeId;
          opt.text = badges[badgeId]?.name || badgeId;
          removeSelect.appendChild(opt);
        });
        const removeBtn = document.createElement("button");
        removeBtn.textContent = "Remove Badge";
        removeBtn.className = "remove";
        removeBtn.onclick = async () => {
          const val = removeSelect.value;
          const updated = (userData.badges || []).filter(b => b !== val);
          await update(ref(db, `users/${uid}`), { badges: updated });
          loadUsers();
        };

        div.appendChild(addSelect);
        div.appendChild(addBtn);
        div.appendChild(removeSelect);
        div.appendChild(removeBtn);
        container.appendChild(div);
      }
    }

    async function loadAllowedPics() {
      const listDiv = document.getElementById("allowedPicsList");
      listDiv.innerHTML = "Loading...";
      const snap = await get(ref(db, "config/allowedProfilePictures"));
      listDiv.innerHTML = "";
      if (!snap.exists()) return listDiv.innerHTML = "<p>No profile pictures allowed yet.</p>";
      const pics = snap.val();
      for (const [id, url] of Object.entries(pics)) {
        const box = document.createElement("div");
        box.style.position = "relative";
        const img = document.createElement("img");
        img.src = url;
        img.style.width = "80px";
        img.style.height = "80px";
        img.style.borderRadius = "50%";
        img.style.objectFit = "cover";
        box.appendChild(img);

        const btn = document.createElement("button");
        btn.textContent = "X";
        btn.className = "remove";
        btn.style.position = "absolute";
        btn.style.top = "-10px";
        btn.style.right = "-10px";
        btn.onclick = async () => {
          await remove(ref(db, `config/allowedProfilePictures/${id}`));
          loadAllowedPics();
        };
        box.appendChild(btn);
        listDiv.appendChild(box);
      }
    }

    async function loadUpdateLog() {
      const container = document.getElementById("updatesList");
      container.innerHTML = "Loading updates...";
      const snap = await get(ref(db, "config/updates"));
      container.innerHTML = "";
      
      if (!snap.exists()) {
        container.innerHTML = "<p>No updates found.</p>";
        return;
      }
      
      const updates = [];
      snap.forEach(child => {
        updates.unshift({ key: child.key, ...child.val() }); // Newest first
      });
      
      updates.forEach(u => {
        const div = document.createElement("div");
        div.className = "badge-item";
        div.innerHTML = `<div class='badge-name'>${u.heading}</div><p>${u.description}</p>`;
        
        const btn = document.createElement("button");
        btn.textContent = "Delete";
        btn.className = "remove";
        btn.onclick = async () => {
            if(confirm("Delete this update?")) {
                await remove(ref(db, `config/updates/${u.key}`));
                loadUpdateLog();
            }
        };
        div.appendChild(btn);
        container.appendChild(div);
      });
    }

    async function loadWheelConfig() {
      const snap = await get(ref(db, "config/wheel"));
      if (snap.exists()) {
        const data = snap.val();
        document.getElementById("wheelPrizes").value = (data.prizes || []).join(", ");
        document.getElementById("wheelCooldown").value = data.cooldown || 24;
      }
    }

    async function loadShopConfig() {
      const container = document.getElementById("shopItemsList");
      container.innerHTML = "Loading...";
      
      let snap = await get(ref(db, "config/shopItems"));
      let items = snap.exists() ? snap.val() : {
        "default": { name: "Default", cost: 0, class: "bubble-default" },
        "blue": { name: "Ocean", cost: 100, class: "bubble-blue" },
        "red": { name: "Sunset", cost: 100, class: "bubble-red" },
        "gold": { name: "Gold", cost: 500, class: "bubble-gold" },
        "rainbow": { name: "Rainbow", cost: 1000, class: "bubble-rainbow" }
      };

      container.innerHTML = "";
      
      for (const [key, item] of Object.entries(items)) {
        const div = document.createElement("div");
        div.style.marginBottom = "10px";
        div.style.padding = "10px";
        div.style.background = "#eee";
        div.style.borderRadius = "5px";
        
        div.innerHTML = `
          <strong>ID: ${key}</strong><br>
          Name: <input type="text" id="shop_name_${key}" value="${item.name}" style="width:150px;">
          Cost: <input type="number" id="shop_cost_${key}" value="${item.cost}" style="width:80px;">
          Class: <input type="text" id="shop_class_${key}" value="${item.class || ''}" placeholder="CSS Class" style="width:100px;">
          Style: <input type="text" id="shop_style_${key}" value="${item.style || ''}" placeholder="CSS Background" style="width:200px;">
        `;
        container.appendChild(div);
      }
    }

    document.getElementById("addBadgeBtn").onclick = async () => {
      const id = document.getElementById("newBadgeName").value.trim();
      const name = document.getElementById("newBadgeDisplayName").value.trim();
      const desc = document.getElementById("newBadgeDescription").value.trim();
      if (!id || !name || /\s/.test(id)) return alert("Invalid badge ID or name");
      await set(ref(db, `badges/${id}`), { name, description: desc });
      loadBadges();
    };

    document.getElementById("addAllowedPicBtn").onclick = async () => {
      const url = document.getElementById("newAllowedPic").value.trim();
      if (!url) return alert("Enter a valid image or base64 URL");
      const id = Date.now();
      await set(ref(db, `config/allowedProfilePictures/${id}`), url);
      document.getElementById("newAllowedPic").value = "";
      loadAllowedPics();
    };

    document.getElementById("saveUpdateLogBtn").onclick = async () => {
      const heading = document.getElementById("updateLogHeading").value;
      const description = document.getElementById("updateLogDescription").value;
      if(!heading || !description) return alert("Please fill in both fields");
      
      const newRef = ref(db, "config/updates/" + Date.now());
      await set(newRef, { heading, description });
      
      document.getElementById("updateLogHeading").value = "";
      document.getElementById("updateLogDescription").value = "";
      loadUpdateLog();
      alert("Update posted!");
    };

    document.getElementById("saveWheelConfigBtn").onclick = async () => {
      const prizesStr = document.getElementById("wheelPrizes").value;
      let cooldownVal = document.getElementById("wheelCooldown").value;
      let cooldown = parseInt(cooldownVal);
      if (isNaN(cooldown)) cooldown = 24;
      const prizes = prizesStr.split(",").map(s => parseInt(s.trim())).filter(n => !isNaN(n));
      
      await set(ref(db, "config/wheel"), { prizes, cooldown });
      alert("Wheel config saved!");
      loadWheelConfig();
    };

    document.getElementById("addShopItemBtn").onclick = async () => {
      const id = document.getElementById("newShopId").value.trim();
      const name = document.getElementById("newShopName").value.trim();
      const cost = parseInt(document.getElementById("newShopCost").value) || 0;
      const style = document.getElementById("newShopStyle").value.trim();
      
      if (!id || !name) return alert("ID and Name are required");
      
      await update(ref(db, `config/shopItems/${id}`), { name, cost, style });
      alert("Item added!");
      loadShopConfig();
    };

    document.getElementById("saveShopConfigBtn").onclick = async () => {
      // We iterate over the known keys to gather values
      // Note: This simple editor modifies existing keys. To add new ones, you'd need an "Add Item" button.
      const container = document.getElementById("shopItemsList");
      const inputs = container.querySelectorAll("input");
      const newConfig = {};
      
      inputs.forEach(input => {
        const parts = input.id.split("_"); // e.g. ["shop", "cost", "blue"]
        const field = parts[1];
        const key = parts.slice(2).join("_");
        
        if (!newConfig[key]) newConfig[key] = {};
        newConfig[key][field] = field === "cost" ? parseInt(input.value) : input.value;
      });

      await set(ref(db, "config/shopItems"), newConfig);
      alert("Shop config saved!");
    };

    document.getElementById("verifyPinBtn").onclick = async () => {
      const input = document.getElementById("adminPinInput").value.trim();
      // Fetch PIN from DB or default to 1234
      const snap = await get(ref(db, "config/adminPin"));
      const realPin = snap.exists() ? String(snap.val()) : "1234";
      
      if (input === realPin) {
        document.getElementById("pinOverlay").style.display = "none";
      } else {
        alert("Incorrect PIN!");
      }
    };

    document.getElementById("loadBadgesBtn").onclick = loadBadges;
    document.getElementById("loadUsersBtn").onclick = loadUsers;
    document.getElementById("loadWheelBtn").onclick = loadWheelConfig;
    document.getElementById("loadShopBtn").onclick = loadShopConfig;
    document.getElementById("loadPicsBtn").onclick = loadAllowedPics;
    document.getElementById("loadUpdatesBtn").onclick = loadUpdateLog;

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("pinOverlay").style.display = "flex";
      } else {
        alert("No user detected. Please log in.");
        window.location.href = "index.html";
      }
    });
  </script>
</body>
</html>
