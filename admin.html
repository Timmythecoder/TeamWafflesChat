<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Badge Panel with Profile Pictures</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
    h1, h2 { color: #333; }
    .section {
      background: #fff; padding: 15px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #ccc;
    }
    .user, .badge-item {
      background: #fafafa; padding: 10px; margin-bottom: 10px;
      border: 1px solid #ddd; border-radius: 6px;
    }
    .user-info, .badge-name {
      font-weight: bold; margin-bottom: 6px;
    }
    .badges { margin-bottom: 6px; }
    .badge {
      display: inline-block; background: #007bff; color: white;
      padding: 4px 8px; border-radius: 5px; margin: 2px;
      user-select: none; cursor: default; position: relative;
    }
    .badge:hover .tooltip { display: block; }
    .tooltip {
      display: none; position: absolute; bottom: 125%; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.8); color: #fff; padding: 5px 8px;
      border-radius: 4px; font-size: 12px; white-space: nowrap; z-index: 10;
    }
    input[type="text"], textarea, select {
      margin-top: 5px; padding: 6px; font-size: 14px; width: 100%;
      box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc;
    }
    button {
      margin-top: 5px; cursor: pointer; padding: 6px 12px;
      border-radius: 4px; border: none; background-color: #007bff;
      color: white; font-weight: bold;
    }
    button.remove { background-color: #dc3545; }
  </style>
</head>
<body>
  <h1>Admin Panel - Badge & Profile Picture Management</h1>

  <div class="section" id="badge-list-section">
    <h2>Badge List</h2>
    <div id="badges"></div>
    <h3>Add New Badge</h3>
    <input type="text" id="newBadgeName" placeholder="Badge ID (unique, no spaces)" />
    <input type="text" id="newBadgeDisplayName" placeholder="Badge Display Name" />
    <textarea id="newBadgeDescription" rows="2" placeholder="Badge Description"></textarea>
    <button id="addBadgeBtn">Add Badge</button>
  </div>

  <div class="section" id="user-list-section">
    <h2>Users</h2>
    <div id="users"></div>
  </div>

  <div class="section" id="allowed-pics-section">
    <h2>Allowed Profile Pictures</h2>
    <div id="allowedPicsList" style="display: flex; flex-wrap: wrap; gap: 10px;"></div>
    <input type="text" id="newAllowedPic" placeholder="Paste image URL or Base64 string" />
    <button id="addAllowedPicBtn">Add Allowed Picture</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getDatabase, ref, get, set, update, remove } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCfTDFXdh1tifQIyY6415IORbdXIffYUJ4",
      authDomain: "team-waffles.firebaseapp.com",
      databaseURL: "https://team-waffles-default-rtdb.firebaseio.com",
      projectId: "team-waffles",
      storageBucket: "team-waffles.appspot.com",
      messagingSenderId: "891460090478",
      appId: "1:891460090478:web:c01b6db1af21745769047f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    async function loadBadges() {
      const container = document.getElementById("badges");
      container.innerHTML = "Loading...";
      const snap = await get(ref(db, "badges"));
      container.innerHTML = "";
      if (!snap.exists()) return container.innerHTML = "<p>No badges found.</p>";
      const badges = snap.val();
      for (const [id, data] of Object.entries(badges)) {
        const div = document.createElement("div");
        div.className = "badge-item";
        div.innerHTML = `<div class='badge-name'>${id} (${data.name})</div><p>${data.description || "No description"}</p>`;
        const btn = document.createElement("button");
        btn.textContent = "Remove Badge";
        btn.className = "remove";
        btn.onclick = async () => {
          if (confirm(`Delete badge '${id}'?`)) {
            await remove(ref(db, `badges/${id}`));
            loadBadges();
          }
        };
        div.appendChild(btn);
        container.appendChild(div);
      }
    }

    async function loadUsers() {
      const container = document.getElementById("users");
      container.innerHTML = "Loading...";
      const [usersSnap, badgesSnap] = await Promise.all([
        get(ref(db, "users")),
        get(ref(db, "badges")),
      ]);
      container.innerHTML = "";
      const badges = badgesSnap.exists() ? badgesSnap.val() : {};
      if (!usersSnap.exists()) return container.innerHTML = "<p>No users found.</p>";
      const users = usersSnap.val();

      for (const [uid, userData] of Object.entries(users)) {
        const div = document.createElement("div");
        div.className = "user";
        div.innerHTML = `<div class='user-info'>UID: ${uid} — Username: ${userData.permanentUsername || "(none)"}</div>`;

        const badgeContainer = document.createElement("div");
        badgeContainer.className = "badges";
        (userData.badges || []).forEach(badgeId => {
          const span = document.createElement("span");
          span.className = "badge";
          span.textContent = badges[badgeId]?.name || badgeId;
          badgeContainer.appendChild(span);
        });
        div.appendChild(badgeContainer);

        const addSelect = document.createElement("select");
        const addDefault = document.createElement("option");
        addDefault.text = "Select badge to add";
        addSelect.appendChild(addDefault);
        Object.entries(badges).forEach(([id, badge]) => {
          if ((userData.badges || []).includes(id)) return;
          const opt = document.createElement("option");
          opt.value = id;
          opt.text = badge.name;
          addSelect.appendChild(opt);
        });
        const addBtn = document.createElement("button");
        addBtn.textContent = "Add Badge";
        addBtn.onclick = async () => {
          const val = addSelect.value;
          if (!val) return alert("Select a badge");
          const updated = [...(userData.badges || []), val];
          await update(ref(db, `users/${uid}`), { badges: updated });
          loadUsers();
        };

        const removeSelect = document.createElement("select");
        const removeDefault = document.createElement("option");
        removeDefault.text = "Select badge to remove";
        removeSelect.appendChild(removeDefault);
        (userData.badges || []).forEach(badgeId => {
          const opt = document.createElement("option");
          opt.value = badgeId;
          opt.text = badges[badgeId]?.name || badgeId;
          removeSelect.appendChild(opt);
        });
        const removeBtn = document.createElement("button");
        removeBtn.textContent = "Remove Badge";
        removeBtn.className = "remove";
        removeBtn.onclick = async () => {
          const val = removeSelect.value;
          const updated = (userData.badges || []).filter(b => b !== val);
          await update(ref(db, `users/${uid}`), { badges: updated });
          loadUsers();
        };

        div.appendChild(addSelect);
        div.appendChild(addBtn);
        div.appendChild(removeSelect);
        div.appendChild(removeBtn);
        container.appendChild(div);
      }
    }

    async function loadAllowedPics() {
      const listDiv = document.getElementById("allowedPicsList");
      listDiv.innerHTML = "Loading...";
      const snap = await get(ref(db, "config/allowedProfilePictures"));
      listDiv.innerHTML = "";
      if (!snap.exists()) return listDiv.innerHTML = "<p>No profile pictures allowed yet.</p>";
      const pics = snap.val();
      for (const [id, url] of Object.entries(pics)) {
        const box = document.createElement("div");
        box.style.position = "relative";
        const img = document.createElement("img");
        img.src = url;
        img.style.width = "80px";
        img.style.height = "80px";
        img.style.borderRadius = "50%";
        img.style.objectFit = "cover";
        box.appendChild(img);

        const btn = document.createElement("button");
        btn.textContent = "X";
        btn.className = "remove";
        btn.style.position = "absolute";
        btn.style.top = "-10px";
        btn.style.right = "-10px";
        btn.onclick = async () => {
          await remove(ref(db, `config/allowedProfilePictures/${id}`));
          loadAllowedPics();
        };
        box.appendChild(btn);
        listDiv.appendChild(box);
      }
    }

    document.getElementById("addBadgeBtn").onclick = async () => {
      const id = document.getElementById("newBadgeName").value.trim();
      const name = document.getElementById("newBadgeDisplayName").value.trim();
      const desc = document.getElementById("newBadgeDescription").value.trim();
      if (!id || !name || /\s/.test(id)) return alert("Invalid badge ID or name");
      await set(ref(db, `badges/${id}`), { name, description: desc });
      loadBadges();
    };

    document.getElementById("addAllowedPicBtn").onclick = async () => {
      const url = document.getElementById("newAllowedPic").value.trim();
      if (!url) return alert("Enter a valid image or base64 URL");
      const id = Date.now();
      await set(ref(db, `config/allowedProfilePictures/${id}`), url);
      document.getElementById("newAllowedPic").value = "";
      loadAllowedPics();
    };

    loadBadges();
    loadUsers();
    loadAllowedPics();
  </script>
</body>
</html>
